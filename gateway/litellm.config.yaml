# Kharcha LLM gateway: NVIDIA hosted models only (build.nvidia.com, OpenAI-compatible).
# Models verified 2026-10-10 with /tmp/nv_probe.py. NVIDIA retires models: run `make llm-smoke`
# before demos; on HTTP 410, list current models (GET /v1/models), test, and update here.
# Fallback = a second NVIDIA model. If both fail, the backend switches to no-LLM degraded mode (SPEC §6).
model_list:
  - model_name: kh-extract-image
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3-nano-omni-30b-a3b-reasoning # ~1.6 s with reasoning off
      api_key: os.environ/NVIDIA_API_KEY
      extra_body: { chat_template_kwargs: { enable_thinking: false } }   # reasoning off: direct answers
  - model_name: kh-extract-image-fb
    litellm_params:
      model: nvidia_nim/meta/llama-3.2-11b-vision-instruct           # 7-13 s, not a reasoning model
      api_key: os.environ/NVIDIA_API_KEY
  - model_name: kh-extract-text
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3-super-120b-a12b             # 0.4 s
      api_key: os.environ/NVIDIA_API_KEY
      extra_body: { chat_template_kwargs: { enable_thinking: false } }   # reasoning off: direct answers
  - model_name: kh-extract-text-fb
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3.5-lightning-30b-a3b         # ~19 s (reasoning)
      api_key: os.environ/NVIDIA_API_KEY
      extra_body: { chat_template_kwargs: { enable_thinking: false } }   # reasoning off: direct answers
  - model_name: kh-agent
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3-super-120b-a12b
      api_key: os.environ/NVIDIA_API_KEY
      extra_body: { chat_template_kwargs: { enable_thinking: false } }   # reasoning off: direct answers
  - model_name: kh-agent-fb
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3.5-lightning-30b-a3b
      api_key: os.environ/NVIDIA_API_KEY
      extra_body: { chat_template_kwargs: { enable_thinking: false } }   # reasoning off: direct answers
  - model_name: kh-parse
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3-super-120b-a12b
      api_key: os.environ/NVIDIA_API_KEY
      extra_body: { chat_template_kwargs: { enable_thinking: false } }   # reasoning off: direct answers
  - model_name: kh-parse-fb
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3.5-lightning-30b-a3b
      api_key: os.environ/NVIDIA_API_KEY
      extra_body: { chat_template_kwargs: { enable_thinking: false } }   # reasoning off: direct answers

router_settings:
  num_retries: 1
  timeout: 20
  allowed_fails: 3
  cooldown_time: 300
  fallbacks:
    - kh-extract-image: [kh-extract-image-fb]
    - kh-extract-text: [kh-extract-text-fb]
    - kh-agent: [kh-agent-fb]
    - kh-parse: [kh-parse-fb]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

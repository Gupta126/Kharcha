[project]
name = "kharcha-eval"
version = "0.1.0"
description = "Kharcha evaluation harness"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Kharcha Team"}
]
keywords = ["expense", "reimbursement", "evaluation", "testing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = []

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
select = ["E", "F", "W", "C90"]
ignore = []

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

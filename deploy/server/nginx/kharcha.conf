# Kharcha site for the VM's existing host nginx (which also serves Apache Guacamole).
# Install (HUMAN, once, at first deploy):
#   sudo cp /opt/kharcha/deploy/server/nginx/kharcha.conf /etc/nginx/sites-available/kharcha.conf
#   sudo sed -i 's/KHARCHA_DOMAIN/<your-subdomain>/' /etc/nginx/sites-available/kharcha.conf
#   sudo ln -s /etc/nginx/sites-available/kharcha.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d <your-subdomain>      # adds the 443 server block + auto-renewal
# This file only adds a new server_name; it never changes the Guacamole site.
server {
    listen 80;
    listen [::]:80;
    server_name KHARCHA_DOMAIN;

    client_max_body_size 20m;          # receipt uploads (SPEC: 15 MB per file)

    location /v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        root /opt/kharcha/console/dist;  # approver console (static build)
        try_files $uri /index.html;
    }
}

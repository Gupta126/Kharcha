# Kharcha hosted stack on the single Oracle VM (kh-core, arm64).
# Run from the RELEASE checkout /opt/kharcha via deploy/scripts/deploy.sh (project name: kharcha).
# The VM's existing host nginx (which also fronts Apache Guacamole) is the only public entry (80/443);
# it proxies the Kharcha subdomain to api on 127.0.0.1:8000 (deploy/server/nginx/kharcha.conf).
# Every port here binds to 127.0.0.1. Memory caps are sized to leave room for Guacamole.
# Original receipt files are stored on the `originals` volume (no MinIO: its Docker Hub image was removed in 2026).
name: kharcha
services:
  api:
    build: ../../backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--proxy-headers", "--forwarded-allow-ips", "*"]
    env_file: ../../.env
    ports: [ "127.0.0.1:8000:8000" ]
    volumes: [ "../../data/seed:/data/seed:ro", "originals:/data/originals" ]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    mem_limit: 384m
    restart: unless-stopped
  worker:
    build: ../../backend
    command: rq worker --url redis://redis:6379/0 extract forensics agent erp
    env_file: ../../.env
    volumes: [ "originals:/data/originals" ]
    depends_on: [ postgres, redis ]
    mem_limit: 640m
    restart: unless-stopped
  forensics:
    build: ../../forensics
    ports: [ "127.0.0.1:8085:8085" ]
    mem_limit: 512m
    restart: unless-stopped
  mock-erp:
    build: ../../mock-erp
    ports: [ "127.0.0.1:8090:8090" ]
    volumes: [ "../../data/seed:/data/seed:ro" ]
    mem_limit: 192m
    restart: unless-stopped
  litellm:
    build: ../../gateway
    environment:                                   # only what the gateway needs; no DATABASE_URL
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
    ports: [ "127.0.0.1:4000:4000" ]
    mem_limit: 512m
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kharcha
      POSTGRES_USER: kharcha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: postgres -c shared_buffers=192MB -c work_mem=4MB -c max_connections=50
    volumes: [ "pg:/var/lib/postgresql/data", "./initdb:/docker-entrypoint-initdb.d:ro" ]
    ports: [ "127.0.0.1:5432:5432" ]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "kharcha"], interval: 10s }
    mem_limit: 1024m
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction
    volumes: [ "redis:/data" ]
    ports: [ "127.0.0.1:6379:6379" ]
    mem_limit: 192m
    restart: unless-stopped
volumes: { pg: {}, redis: {}, originals: {} }

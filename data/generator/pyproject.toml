[project]
name = "kharcha-generator"
version = "0.1.0"
description = "Synthetic receipt generator for Kharcha"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Kharcha Team"}
]
keywords = ["expense", "receipt", "generator", "synthetic"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "faker>=30.0.0",
    "pillow>=10.0.0",
    "reportlab>=4.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["../.."]
include = ["data*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

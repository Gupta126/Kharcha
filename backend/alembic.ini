# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = backend

# If non-empty, apply Alembic's logging configuration to the
# standard Python logging framework. Namely,
# ``fileConfig([config_file_name])`` will be invoked via the
# ``logging`` module which results in the logger named
# ``'alembic'`` being configured via the incoming configuration.
#
# The value is an absolute path to, or a relative path from
# this file, of a logging configuration file.
# See the logging configuration file section for details on the format.
# Uncomment the line below to use Alembic's standard logging
# configuration which is provided with Alembic.
# config_file_name = logging.conf

# Specify the version locators for either %(version_loc)s or
# the default %(version_locations)s. Each
#   location defines one or more directories, searched for
#   versions. The order in which the locations presented within
#   the string indicates the order in which they are searched.
# Alternately, comment the line below to use the default
#   directory scheme.
# version_locations = %(here)s/bar:%(here)s/bar

# The version path separator. As mentioned above, the default
#   version path separator is ``::``.
# version_path_separator = '|'
# Version location separator; by default, the template uses ``,``.
# version_loc_separator = ','

[post_write_hooks]
# post_write_hooks specifies scripts or Python objects to be run
# on newly generated revision scripts. See the documentation
#  for further details and examples

# Format using "black" - use the console_scripts entry point
# If you use Black as part of your pytest configuration you
# may want to remove this hook to avoid running Black twice
# on any revised code.
# hooks = black_black
# black_black.type = console_scripts
# black_black.entrypoint = black
# black_black.options = -l 79 REVISION_SCRIPT_FILENAME

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(asctime)s] %(name)s: %(message)s
